# Load mod_botshield.
#
# Install destination is distribution-specific, and the name changes
# with it:
#
#   Rocky / RHEL / Fedora   /etc/httpd/conf.modules.d/30-botshield.conf
#   Debian / Ubuntu         /etc/apache2/mods-available/botshield.load
#                           then `a2enmod botshield`
#
# The numeric prefix is not decoration. Apache includes conf.modules.d
# by glob and loads the results in lexical order, so the number is what
# places this module relative to the others. 30 puts it after the base
# module set without being fussy about it; nothing here depends on
# load order beyond that, because the module orders its own hooks by
# position rather than by when it was loaded.
#
# Adjust the path if the module is installed somewhere other than the
# server root's modules directory.
LoadModule botshield_module modules/mod_botshield.so
