<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Access check · Crestline Research Library</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin: 0; padding: 0; }
  body {
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #1f2530;
    background: #f5f5f2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: .65rem;
    padding: 1rem 2rem;
    background: #fff;
    border-bottom: 1px solid #dcdcd2;
  }
  header strong { font-size: 1rem; letter-spacing: .01em; }
  main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem 1rem;
    gap: 1.25rem;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0;
    color: #1f2530;
    font-weight: 600;
  }
  .blurb {
    max-width: 440px;
    text-align: center;
    color: #55605e;
    margin: 0;
  }
  footer {
    padding: 1rem 2rem;
    color: #55605e;
    font-size: 13px;
    text-align: center;
    border-top: 1px solid #dcdcd2;
  }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true" focusable="false">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3b7a66"/>
      <stop offset="1" stop-color="#1a3a2e"/>
    </linearGradient></defs>
    <path d="M32 4 L56 12 V32 C56 46 44 56 32 60 C20 56 8 46 8 32 V12 Z"
          fill="url(#g)" stroke="#0f2a22" stroke-width="1.5"/>
    <path d="M19 32 L28 41 L45 22" fill="none" stroke="#fff3b0"
          stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <strong>Crestline Research Library</strong>
</header>
<main>
  <h1>Just a quick check</h1>
  <p class="blurb">
    We're verifying your browser before opening the catalog. It takes a
    moment and doesn't require any input from you.
  </p>
  <!-- BOTSHIELD -->
</main>
<footer>
  Trouble getting in? Email <a href="mailto:help@example.test">help@example.test</a>.
</footer>
</body>
</html>
