# PEP 621 / PEP 660 project config for the mod_botshield Python test
# suite. Not publishable — this only exists so `pip install -e .`
# picks up `botshield_test/` as an importable package and so pytest
# picks up the tool config.

[project]
name = "botshield-test"
version = "0.0.0"
description = "mod_botshield pytest framework (M11.4+)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
]
browser = [
    "pytest-playwright>=0.7",
    "playwright>=1.58",
]

[tool.setuptools.packages.find]
include = ["botshield_test*"]

[tool.pytest.ini_options]
# Tests live under tests/pytests/. The archived bash suite in
# tests/bash-legacy/ is intentionally excluded from discovery.
testpaths = ["pytests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Default options for every pytest invocation:
#   --screenshot=only-on-failure — pytest-playwright grabs a PNG on
#     browser-test failure. Lands under test-results/<testname>/.
#     M11.6 promised this; wiring here so tests/run + CI + direct
#     pytest invocations all get it without per-callsite repetition.
#   --video=retain-on-failure — short .webm capture of the failing
#     browser session. Same location. Useful for diagnosing
#     timing-sensitive form_tier / captcha_tier regressions.
# Non-browser tests ignore these flags — pytest-playwright only
# emits artifacts for tests using its fixtures.
addopts = "--screenshot=only-on-failure --video=retain-on-failure"
# Fail fast on first unexpected pass: no silent SKIP-as-XPASS.
xfail_strict = true
# Each test has to finish in under 2 minutes. The rate-limit test's
# parallel burst is the slowest thing we do and finishes in < 10s.
timeout = 120
markers = [
    "serial: test must not run in parallel (mutates Apache config or SHM)",
    "live_network: requires reachable third-party captcha siteverify",
    "live_provider: requires a real provider secret/token via env var",
    "slow: multi-second test; opt-in in fast CI lanes",
    "acceptance: end-to-end user-journey test",
    "browser: runs against a real headless Chromium via pytest-playwright",
]
# Keep warnings loud — typos in filter names and fixture renames
# often surface as deprecation warnings here before they break tests.
filterwarnings = [
    "error",
    # httpx emits this under Python 3.12 on systems without a specific
    # TLS ciphers config; not load-bearing for our tests.
    "ignore::DeprecationWarning:httpx",
]
