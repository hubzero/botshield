# PEP 621 / PEP 660 project config for the mod_botshield Python test
# suite. Not publishable — this only exists so `pip install -e .`
# picks up `botshield_test/` as an importable package and so pytest
# picks up the tool config.

[project]
name = "botshield-test"
version = "0.0.0"
description = "mod_botshield pytest framework (M11.4+)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
include = ["botshield_test*"]

[tool.pytest.ini_options]
# pytest discovers tests under tests/pytests/ only. The bash suite
# lives in tests/unit, tests/integration, tests/acceptance and is
# driven by tests/run until M11.5 retires it.
testpaths = ["pytests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Fail fast on first unexpected pass: no silent SKIP-as-XPASS.
xfail_strict = true
# Each test has to finish in under 2 minutes. The rate-limit test's
# parallel burst is the slowest thing we do and finishes in < 10s.
timeout = 120
markers = [
    "serial: test must not run in parallel (mutates Apache config or SHM)",
    "live_network: requires reachable third-party captcha siteverify",
    "live_provider: requires a real provider secret/token via env var",
    "slow: multi-second test; opt-in in fast CI lanes",
]
# Keep warnings loud — typos in filter names and fixture renames
# often surface as deprecation warnings here before they break tests.
filterwarnings = [
    "error",
    # httpx emits this under Python 3.12 on systems without a specific
    # TLS ciphers config; not load-bearing for our tests.
    "ignore::DeprecationWarning:httpx",
]
