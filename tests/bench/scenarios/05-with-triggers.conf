# Scenario 05 — bare-on + a realistic mix of trigger directives across
# families. Each request walks the cookie / env / load / scope / path
# trigger lists in bs_check_policy. Designed to mirror what an active
# operator's config might look like: a handful of rules per family.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog /dev/null combined

    BotShieldEnabled    on
    BotShieldSecretFile /etc/botshield/secret
    BotShieldAlgorithm  sha256-zeros

    # Cookie triggers — three rules covering common patterns.
    BotShieldCookieTrigger session-active   cookie=sessionid       status=pass credit=5
    BotShieldCookieTrigger weak-session     cookie=sessionid=guest penalty=15
    BotShieldCookieTrigger no-cookies       cookies=none           penalty=5

    # Env triggers — two rules.
    SetEnvIfExpr "true" BS_BENCH=1
    BotShieldEnvTrigger bench-tag           env=BS_BENCH           status=pass credit=2

    # Path triggers — three rules covering the typical honeypot-and-
    # quirks shape.
    BotShieldRequestTrigger admin-honeypot     path="/admin/.env"          status=403 flag=honeypot_hit ttl=3600
    BotShieldRequestTrigger api-burst-trap     path="/api/burst"           penalty=30
    BotShieldRequestTrigger static-pass        path="/static/*"            status=pass

    # Per-scope BotShieldTrigger inside a <Location>.
    <Location "/admin/.env">
        BotShieldTrigger flag=honeypot_hit ttl=3600 log=admin-trap
    </Location>

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
