# Scenario 01 — Baseline. Apache only, no botshield directives.
# The module is loaded by mods-enabled but the vhost doesn't use any
# of its directives, so the per-request cost is the LoadModule + the
# module's request handler returning DECLINED at the very top of
# bs_handler before any feature path runs.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog ${APACHE_LOG_DIR}/botshield-bench-access.log combined

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
