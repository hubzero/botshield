# Scenario 11 — baseline (no BotShield directives), single connection.
# WRK_FLAGS: -t 1 -c 1
#
# Pair with scenario 10 (bare-on-singleconn) to read the per-
# request mod_botshield cost cleanly: 10's RPS vs 11's RPS at the
# same -t 1 -c 1 client shape isolates the per-request CPU /
# system-call delta from any concurrency-related effects (SHM
# contention, accept-queue dynamics, scheduler noise).
#
# Conventionally read:
#   per-request cost ≈ (1/rps_10) − (1/rps_11)

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog ${APACHE_LOG_DIR}/botshield-bench-access.log combined

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
