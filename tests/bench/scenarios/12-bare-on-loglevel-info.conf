# Scenario 12 — bare-on + `LogLevel botshield_module:info`.
#
# Identical to scenario 03 except the module's log level is bumped
# from the inherited `warn` to `info`, which turns on the structured
# `bs_decision_log` emission (one `key=value` line per gated request).
# For our pass-through workload that's one ap_log_rerror call per
# request — string format, lock + write to the ErrorLog file.
#
# The prose log line for pass decisions is at debug level and stays
# suppressed even at info; only the canonical decision line fires.
#
# Read 12 vs 03 to isolate the per-request cost of the decision-log
# I/O (the operator-visible knob that turns logging on for
# operational visibility).
#
# ErrorLog stays a real file — that's the production shape. If you
# want to measure format-string-without-disk separately, point
# ErrorLog at /dev/null and re-run.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog /dev/null combined

    LogLevel botshield_module:info

    BotShieldEnabled    on
    BotShieldSecretFile /etc/botshield/secret
    BotShieldAlgorithm  sha256-zeros

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
