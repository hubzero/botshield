# Scenario 10 — bare-on, single connection.
# WRK_FLAGS: -t 1 -c 1
#
# Same config as 03-bare-on; the only difference is the wrk client
# uses one thread + one connection (-t 1 -c 1) instead of -t 4 -c 100.
# Isolates per-request CPU cost from connection-level concurrency
# effects (epoll wakeups, mutex contention on shared SHM, scheduler
# noise from many runnable connections). The RPS at -c 1 is the
# inverse of the per-request median latency on a single core under
# no contention — the cleanest "what does each request actually
# cost?" number.
#
# Compare 10's RPS against 03's RPS: if 03's per-connection latency
# divided into 10's RPS is similar to 03's RPS, scaling is clean;
# if 03 falls far below the linear projection, the bottleneck is in
# the concurrent path (SHM contention, lock holds, etc.) not the
# per-request work.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog /dev/null combined

    BotShieldEnabled    on
    BotShieldSecretFile /etc/botshield/secret
    BotShieldAlgorithm  sha256zeros

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
