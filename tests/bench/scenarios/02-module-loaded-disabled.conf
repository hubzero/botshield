# Scenario 02 — Module loaded, explicit BotShieldEnabled off.
# Identical surface to the baseline at the request level (the handler
# short-circuits at the enabled check) but the directive is parsed at
# config-load. Captures any incidental cost of the directive being
# evaluated per-request vs not present at all.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog ${APACHE_LOG_DIR}/botshield-bench-access.log combined

    BotShieldEnabled off

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
