# Scenario 09 — bare-on with a valid `_bs_session` cookie attached.
# WRK_LUA: cookie
#
# The harness mints a cookie before the wrk run by hitting this
# vhost with a scraper UA (forces silent tier), solving the PoW,
# and capturing the resulting envelope. wrk attaches the cookie
# to every request via wrk-cookie.lua.
#
# Each request hits the happy-cached-pass path: cookie present →
# GCM-decrypt → verify PoW counter → score below threshold →
# DECLINED. This is the cheapest configured-on case and the most
# representative of ongoing operator traffic, where most requests
# carry a cookie.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog /dev/null combined

    BotShieldEnabled    on
    BotShieldSecretFile /etc/botshield/secret
    BotShieldAlgorithm  sha256-zeros

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
