# Scenario 07 — scenario 05 + shadow mode globally enabled.
# Every trigger match flips into observe semantics. Tests whether
# observe-mode evaluation is materially cheaper or more expensive
# than enforce.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog ${APACHE_LOG_DIR}/botshield-bench-access.log combined

    BotShieldEnabled    on
    BotShieldSecretFile /etc/botshield/secret
    BotShieldAlgorithm  sha256-zeros
    BotShieldShadowMode on

    BotShieldCookieTrigger session-active   cookie=sessionid       status=pass credit=5
    BotShieldCookieTrigger weak-session     cookie=sessionid=guest penalty=15
    BotShieldCookieTrigger no-cookies       cookies=none           penalty=5

    SetEnvIfExpr "true" BS_BENCH=1
    BotShieldEnvTrigger bench-tag           env=BS_BENCH           status=pass credit=2

    BotShieldPathTrigger admin-honeypot     "/admin/.env"          status=403 flag=honeypot_hit ttl=3600
    BotShieldPathTrigger api-burst-trap     "/api/burst"           penalty=30
    BotShieldPathTrigger static-pass        "/static/*"            status=pass

    <Location "/admin/.env">
        BotShieldTrigger flag=honeypot_hit ttl=3600 log=admin-trap
    </Location>

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
