# Scenario 07 — scenario 05 + shadow mode globally enabled.
# Every trigger match flips into observe semantics. Tests whether
# observe-mode evaluation is materially cheaper or more expensive
# than enforce.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog /dev/null combined

    BotShieldEnabled    on
    BotShieldSecretFile /etc/botshield/secret
    BotShieldAlgorithm  sha256zeros
    BotShieldLogOnly on

    BotShieldCookieTrigger session-active   cookie=sessionid       respond=nochallenge score="botsignals -5"
    BotShieldCookieTrigger weak-session     cookie=sessionid=guest score="botsignals +15"
    BotShieldCookieTrigger no-cookies       cookies=none           score="botsignals +5"

    SetEnvIfExpr "true" BS_BENCH=1
    BotShieldEnvTrigger bench-tag           env=BS_BENCH           respond=nochallenge score="botsignals -2"

    BotShieldRule admin-honeypot     path="/admin/.env"          respond=403 flag=honeypot_hit ttl=3600
    BotShieldRule api-burst-trap     path="/api/burst"           score="botsignals +30"
    BotShieldRule static-pass        path="/static/*"            respond=nochallenge

    <Location "/admin/.env">
        BotShieldTrigger flag=honeypot_hit ttl=3600 logas=admin-trap
    </Location>

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
