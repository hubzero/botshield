# Scenario 06 — bare-on + robots.txt enforcement.
# A moderately-sized robots.txt is parsed at config-load and consulted
# per request via the path-glob matcher.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName bench.localhost
    DocumentRoot /var/www/botshield-bench

    ErrorLog ${APACHE_LOG_DIR}/botshield-bench-error.log
    CustomLog ${APACHE_LOG_DIR}/botshield-bench-access.log combined

    BotShieldEnabled    on
    BotShieldSecretFile /etc/botshield/secret
    BotShieldAlgorithm  sha256-zeros

    BotShieldRobotsTxt              /etc/botshield/bench-robots.txt
    BotShieldRobotsRefreshInterval  60
    BotShieldRobotsWildcardScope    heuristic

    <Directory /var/www/botshield-bench>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
