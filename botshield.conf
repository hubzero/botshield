# ============================================================================
# mod_botshield — complete configuration for a HubZero hub
#
# Install:   /etc/httpd/conf/botshield.conf
# Activate:  one line, in a file hzcms does NOT regenerate:
#
#              echo 'Include conf/botshield.conf' \
#                | sudo tee /etc/httpd/conf.d/25-botshield.conf
#
# Do NOT put the Include in sites.d/*.conf or sites-m4/*.m4. hzcms
# regenerates those. On geodynamics.org the config lived in the vhost,
# was mirrored into the m4, and was still lost on 2026-08-06 when the
# vhost was regenerated: every enforcing scope silently disappeared and
# the site ran unprotected for two days behind a green configtest.
# conf.d/ is not hzcms-managed. That is the whole reason for this layout.
#
# SCOPE: this file must be included at MAIN SERVER scope, not inside a
# <VirtualHost>. BotShieldStateFile and BotShieldStateSaveInterval are
# RSRC_CONF and are read once, before vhosts merge; inside a vhost they
# parse cleanly and are then ignored with a NOTICE. Everything here is
# inherited by every vhost on the host.
#
# LoadModule is NOT here — it ships in conf.modules.d/30-botshield.conf,
# which holds that one line and nothing else.
#
# ROLLOUT: as shipped this file ENFORCES NOTHING. It observes the whole
# site and writes what it would have done to the decision log. The
# enforcing <LocationMatch> blocks in §6 are commented out — uncomment
# them ONE AT A TIME, checking free scoreboard slots before each reload
# (§6). Read §5 of deploy.md before enabling any of them.
# ============================================================================

<IfModule botshield_module>

# ---------------------------------------------------------------------------
# 1. Persistent state                                    (main scope only)
# ---------------------------------------------------------------------------
# Without this, the flagged-IP table, Bloom filters and every dashboard
# counter reset on each restart — including the nightly logrotate
# restart, which would silently wipe the 24h and all-time windows daily.
BotShieldStateFile          /var/lib/botshield/state.bin
BotShieldStateSaveInterval  300

# ---------------------------------------------------------------------------
# 2. robots.txt — parsed and recorded, enforcing nothing
# ---------------------------------------------------------------------------
# Point at the file actually served for this hub.
BotShieldRobotsTxt          /var/www/qubeshub/robots.txt

# observe = record violations, refuse nobody. Enabling robots.txt in
# enforce mode on geodynamics 403'd GPTBot and ClaudeBot within minutes,
# before anyone had decided that was policy. Read the observe data first
# (§7 of deploy.md), then decide.
BotShieldRobotsMode         observe

# off = do NOT apply the `User-agent: *` group to unrecognised UAs.
# The default is `heuristic`, which treats any non-browser UA as a
# crawler candidate. bs_ua_is_crawler_candidate() is literally
# !is_browser, so a UA the browser templates miss is treated as a
# crawler — mobile Chrome was missed, and real phones took
# `Disallow: /login*` as a hard 403 with no challenge to solve, for
# about two hours. Leave this off until mobile is verified on THIS host
# (§9 of deploy.md). Values: off | heuristic | strict.
BotShieldRobotsWildcardScope off

# BotShieldRobotsRefreshInterval is not set: the default is already 60s.

# ---------------------------------------------------------------------------
# 3. Crawler rate limiting — explicit, and observing
# ---------------------------------------------------------------------------
# This line looks redundant. It is not, and omitting it is a live hazard.
#
# When the module is enabled at vhost scope and no BotShieldBotRateLimit
# directive exists, post_config SYNTHESISES `* 1 sec` — and the
# synthetic entry has no mode, so it ENFORCES. Nobody writes it and it
# returns real 429s. On geodynamics that meant throttling verified
# Bingbot before rate-limiting had been agreed to.
#
# Stating it explicitly with mode=observe suppresses the synthesis and
# records violations instead. `BotShieldBotRateLimit Off` disables the
# subsystem entirely if that is what you want.
BotShieldBotRateLimit  *  1 sec  mode=observe

# ---------------------------------------------------------------------------
# 4. Site-wide observation
# ---------------------------------------------------------------------------
# LogOnly runs the full pipeline — classification, scoring, triggers —
# and records the decision without acting on it. This is the baseline:
# it is how you find out what enforcement would do to real traffic
# before it does it.
#
# Note this applies to EVERY vhost on the host, including proxy/vnc/
# webdav endpoints, because a main-scope directive is inherited. That is
# harmless for LogOnly. If you need it confined to one hostname, wrap
# the directive:  <If "%{HTTP_HOST} == 'qubeshub.org'"> ... </If>
BotShieldEnabled  LogOnly

# ---------------------------------------------------------------------------
# 5. Decision log
# ---------------------------------------------------------------------------
# Defaults are deliberate and need no directives:
#   BotShieldDecisionLog  logs/botshield.log   (= /var/log/httpd/botshield.log)
#   access-log suppression for challenged | block | rate_limited | redirect
#   decision-log outcomes = actionable set U access-log suppression mask
# The invariant: anything suppressed from the access log is guaranteed to
# appear in the decision log. Nothing is silently dropped.
#
# This log measured 258 MB/hour under flood. Rotation is NOT optional —
# see §5 of deploy.md for the logrotate config and hourly cron.

# ---------------------------------------------------------------------------
# 6. Enforcing scopes  —  COMMENTED OUT. Enable one at a time.
# ---------------------------------------------------------------------------
# Before each reload:
#   curl -s http://127.0.0.1/server-status?auto \
#     | grep '^Scoreboard' | tr -cd '.' | wc -c        # want > 100
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# Gate the reload on configtest's EXIT CODE, as above. Reading its output
# is not enough: piping configtest to `tail` and running restart in the
# same command anyway took geodynamics down for ~30 seconds.
#
# configtest does not exercise post_config, so a green configtest is not
# a rehearsal for a reload.
#
# The auth paths are the highest-value scope and the one to enable first:
# an unbounded /login?return= URL space is what drew the original flood.

#<LocationMatch "^/(login|register)(/|$)">
#    BotShieldEnabled On
#</LocationMatch>

#<LocationMatch "^/resources/browse">
#    BotShieldEnabled On
#</LocationMatch>

#<LocationMatch "^/citations/browse">
#    BotShieldEnabled On
#</LocationMatch>

#<LocationMatch "^/publications">
#    BotShieldEnabled On
#</LocationMatch>

#<LocationMatch "^/groups/[^/]+/publications">
#    BotShieldEnabled On
#</LocationMatch>

# Month/day/week calendar views only. The YEAR view is deliberately left
# out: events are not indexed in Solr and are reachable only by walking
# the calendar, so the year view is the sanctioned bounded crawl path
# (~22 pages). Enforcing it would make events undiscoverable.
#
# CHECK THE PREFIX ON YOUR HUB. Events are mounted at /events/ on
# geodynamics and at /news/events/ on qubeshub, so neither pattern
# matches both hubs -- and a scope that never matches fails silently.
# Confirm against this host's access log before trusting either line:
#     awk -F'"' '{split($2,r," "); print r[2]}' <access_log> \
#       | grep -o '^/[a-z/]*events' | sort | uniq -c | sort -rn
#
# The trailing slash is load-bearing: it confines the scope to
# YYYY/M and YYYY/M/D and leaves the bare year view, /details/<id>,
# and bare numeric event ids crawlable.
#<LocationMatch "^/events/[0-9]{4}/">
#    BotShieldEnabled On
#</LocationMatch>

# The /news/events/ form of the same scope. On qubeshub this was the
# single largest PHP cost on the host and the largest gap left after the
# four scopes above: measured 2026-08-08, 4,331 hits from 4,310 distinct
# IPs -- one request per IP, rotating spoofed Chrome/Edge UAs, all 200s,
# 256 s of server time. Enabled there 2026-08-08 14:50 EDT.
#<LocationMatch "^/news/events/[0-9]{4}/">
#    BotShieldEnabled On
#</LocationMatch>

# Shibboleth SAML callback — never challenge it. Uncomment alongside the
# auth-path block above if this hub uses SAML login.
#<LocationMatch "^/login/">
#    BotShieldEnabled Off
#</LocationMatch>

# ---------------------------------------------------------------------------
# 7. Who may read the dashboard and metrics
# ---------------------------------------------------------------------------
# Each endpoint is CLOSED until its own directive names someone. They
# expose internal vhost names, traffic volumes, challenge/solve rates
# and SHM capacities, so the default is deny and these directives are
# the only way to open them. A refusal is a 404, not a 403, so a scan
# cannot tell the endpoint exists.
#
# Uncomment and set to your own address. Localhost only is the useful
# default because it pairs with an SSH tunnel:
#   ssh -L 8443:<vhost-ip>:443 <host>
#   then browse https://localhost:8443/botshield/dashboard
#
#BotShieldDashboardAccess 127.0.0.1 ::1
#BotShieldMetricsAccess   127.0.0.1 ::1

# One directive per endpoint, so opening one does not open the other.
# A Prometheus scraper and an admin browser are rarely the same host:
#BotShieldMetricsAccess   10.9.0.5
#BotShieldDashboardAccess 10.1.0.0/16

# Directives accumulate, so keep one network per line with its reason.
# `all` reopens the old world-readable behaviour explicitly; `none`
# closes an endpoint and refuses a grant inherited from server scope.

# WHY NOT `Require ip` FOR THIS -- it will lock you out of the ENTIRE
# SITE, not just the dashboard. HubZero ships a fail2ban jail
# `apache-hz_access_denied` -- maxretry=5, findtime=120s,
# bantime=36000s -- watching <hub>-error.log for AH01630. The dashboard
# auto-refreshes every 30s and each authz denial writes an AH01630 line,
# so a denied dashboard trips 5-in-120s and self-bans the viewer's IP at
# the firewall for 10 HOURS. That happened on geodynamics.org on
# 2026-08-08 and took the operator off the whole site.
#
# These directives do not have that failure mode: a refusal is
# handled inside the module and writes NOTHING to the error log, so
# there is no AH01630 and nothing for a jail to count. Verified by
# probe -- eight refused dashboard requests produced zero error-log
# lines from this module.
#
# No <Location> is needed to make these endpoints reachable: they sit
# under the vhost DocumentRoot as far as the directory walk goes, so
# whatever grants the document root grants them. A `Require all granted`
# written just for them does nothing.
#
# Compounding with <Location> still works and is the right way to add a
# password: Apache decides whether the request reaches the module, the
# module decides whether the surface is served. Verify any auth
# scheme's failure mode against `apache-error` and
# `apache-hz_access_denied` first -- repeated auth failures on an
# auto-refreshing page are the same shape of problem as the ban above.
#<LocationMatch "^/botshield/dashboard">
#    AuthType Basic
#    AuthName "BotShield"
#    AuthUserFile /etc/httpd/botshield.htpasswd
#    Require valid-user
#</LocationMatch>

# The functional challenge endpoints — embedded-verify, embedded.js,
# embedded-bootstrap, safeguard-info — MUST stay public. They are the
# challenge flow. Do not add them to the block above.

</IfModule>
