# mod_botshield development vhost
#
# Serves the minimal test docroot at ${BS_REPO}/tests/site/ over HTTPS
# on localhost with a self-signed cert. Port 80 redirects to 443. The
# docroot is committed to the repo (tests/site/) so the dev environment
# is reproducible across machines.
#
# BS_REPO must point at this checkout. tests/setup/provision.sh writes
# /etc/apache2/conf-available/botshield-repo.conf containing the right
# Define and a2enconf's it before installing this vhost. For manual
# Apache configurations without provision.sh, drop a one-line file at
# /etc/apache2/conf-available/botshield-repo.conf saying:
#
#   Define BS_REPO /your/path/to/mod_botshield
#
# and a2enconf it. We deliberately abort startup with a clear message
# rather than fall back to a default that would silently serve content
# from somewhere unexpected.
<IfDefine !BS_REPO>
    Error "BS_REPO is not defined. Run 'sudo tests/setup/provision.sh' from your checkout, or drop 'Define BS_REPO /path/to/mod_botshield' into /etc/apache2/conf-available/botshield-repo.conf and a2enconf botshield-repo."
</IfDefine>

# Enable:
#   sudo cp botshield-dev.conf /etc/apache2/sites-available/
#   sudo a2dissite 000-default
#   sudo a2ensite botshield-dev
#   sudo apachectl configtest && sudo systemctl reload apache2

# Server-scope module tuning. SHM-sizing and state-file directives must
# live at main-server scope, not inside a <VirtualHost> — the SHM segment
# and state file are module-global, so the main server's config is what
# post-config reads.
BotShieldStateFile /var/lib/botshield/state.bin
# Dev-only: short interval so the periodic-save log line shows up
# within a test cycle. Production sites should leave the default 300s.
BotShieldStateSaveInterval 30

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost/
    ErrorLog  ${APACHE_LOG_DIR}/botshield-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/botshield-dev-access.log combined
</VirtualHost>

<IfModule ssl_module>
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot ${BS_REPO}/tests/site
    Alias /mod_botshield/ ${BS_REPO}/docs/
    RedirectMatch 302 ^/mod_botshield$ /mod_botshield/

    SSLEngine on
    SSLCertificateFile      /etc/ssl/botshield-dev/server.crt
    SSLCertificateKeyFile   /etc/ssl/botshield-dev/server.key
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # Browsers accumulate cookies for "localhost" across every dev project
    # that uses it, routinely blowing past Apache's default 8 KB field size
    # and producing "400 Bad Request" before any handler runs. 32 KB is
    # enough headroom without being reckless.
    LimitRequestFieldSize   32768

    <Directory ${BS_REPO}/tests/site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory ${BS_REPO}/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    DirectoryIndex index.html

    # Keep responses cache-friendly for static assets, strict for HTML.
    <FilesMatch "\.(css|js|svg|png|jpg|woff2?)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-store"
    </FilesMatch>

    # Identify this env in responses so curl/browser confirm the vhost.
    Header always set X-Botshield-Env "dev"

    ErrorLog  ${APACHE_LOG_DIR}/botshield-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/botshield-dev-access.log combined
    LogLevel  info

    # mod_botshield is loaded globally via /etc/apache2/mods-enabled/botshield.load
    # (managed by `a2enmod botshield`). Turn it on here for the whole vhost, and
    # scope individual features per-URL below.
    BotShieldEnabled     On
    BotShieldHeuristicTrigger missing-ua      action=score add=40
    BotShieldHeuristicTrigger missing-al      action=score add=5
    BotShieldHeuristicTrigger scraper-ua      action=score add=10
    BotShieldHeuristicTrigger first-sight-ip  action=score add=20
    BotShieldHeuristicTrigger dropped-cookie  action=score add=25

    # Score-to-tier ladder. An unset threshold now means NEVER, so
    # these three lines are what make cumulative score act at all.
    BotShieldScoreNonInteractive   20
    BotShieldScoreInteractive      50
    BotShieldScoreCaptcha          80

    # Flag-driven adjustment. Faithful to the slate that used to be
    # compiled in, EXCEPT that the tier_floor rows are omitted: a floor
    # is "at least this intense regardless of cumulative score", and
    # regardless of score includes regardless of the -985 verified-bot
    # credit. That is how honeypot_hit's captcha floor challenged
    # Googlebot 248 times over ten hours. Add a floor deliberately if a
    # signal really is definitive.
    BotShieldFlagTrigger honeypot_hit          action=score add=60
    BotShieldFlagTrigger fake_bot              action=score add=80
    BotShieldFlagTrigger scanner_probe         action=score add=50
    BotShieldFlagTrigger pow_fail_streak       action=score add=30
    # Trust signals from the app bridge. Credits, so score-only.
    BotShieldFlagTrigger app_verified_human    action=score add=-80
    BotShieldFlagTrigger app_verified_session  action=score add=-40
    BotShieldFlagTrigger app_trust_signal      action=score add=-20

    # No BotShieldBotRateLimit here, and none is needed. This used to
    # carry an explicit `Off`, because enabling the module synthesized
    # `* 1 sec` for every known-bot slug: the suite fires rapid repeated
    # requests from one UA to exercise safeguard, triggers and challenge
    # flows, and the second request of each burst came back 429 instead
    # of the response under test. That was 28 failures that looked like
    # module bugs and were a rate limit nobody had asked for, doing its
    # job. The synthesis is gone, so nothing needs disabling, and the
    # `Off` had to go with it: it now declines robots.txt Crawl-delay
    # groups, which the robots tests rely on.

    # first-sight-ip defaults to 20 -- exactly BotShieldScoreNonInteractive --
    # so with stock thresholds EVERY first-time visitor is challenged,
    # including a flawless browser. 13 tests in the suite assume a clean
    # first visit passes, among them test_acceptance_pass_tier, whose
    # docstring reads "if this test fails, every regular user is seeing
    # a challenge".
    #
    # THIS LINE PAPERS OVER A REAL DISAGREEMENT, deliberately, so the
    # suite is usable. directives.md says challenging a session-less
    # request is the intended default; the tests say the opposite. One
    # of them is wrong and it is a product decision, not a test-harness
    # one. Evidence it was once 5: shm.h carried an orphaned
    # BS_FIRST_SIGHT_PENALTY 5, defined and referenced nowhere, while
    # the live value BS_PENALTY_FIRST_SIGHT_IP in score.h is 20.
    #
    # Note the combined `reset action=` form is required. Two separate
    # directives -- `<name> reset` then `<name> action=score add=5` --
    # silently leave BOTH entries active and score 25 (20 + 5).
    BotShieldHeuristicTrigger first-sight-ip reset action=score add=5
    BotShieldSecretFile  /etc/botshield/secret
    BotShieldAlgorithm   sha256-zeros

    # Serve the generated project docs as plain static content under
    # /mod_botshield/ without challenging them. This keeps the docs
    # preview path separate from the module-owned /botshield prefix.
    <Location /mod_botshield>
        BotShieldEnabled Off
    </Location>

    # M8 captcha. Each provider gets its own verify-URL Location block
    # so multiple providers can cohabit on one vhost (hcaptcha as
    # fallback for turnstile during a Cloudflare outage, say). The demo
    # scopes below point their interstitial forms at
    # /botshield/captcha-verify/<provider>; operators running a single
    # provider can still use the bare /botshield/captcha-verify URL and
    # put a single set of BotShieldCaptcha* directives at vhost scope.
    BotShieldCaptchaTimeout    1500

    # Declared explicitly at its default value so the inflight-cap
    # regression test (tests/pytests/test_inflight_cap.py) can
    # config_override it down without having to insert a new line.
    BotShieldCaptchaMaxInFlight 64

    # E1 — Allow family. On in dev so pytest can exercise the
    # The bundled built-ins (googlebot, bingbot, applebot,
    # googleother, siteimprove from vendor/verified-bots.json)
    # auto-load and read /var/lib/botshield/bots/<name>.txt for
    # IP cross-check. The verified-bot pass is on by default;
    # operators wanting to skip the IP check (e.g. when CIDR
    # data is stale) can use 'BotShieldClassify -verified-bots'.

    # BotShieldBotRateLimit — slug-keyed rate limit per known bot
    # identity. Composes with BotShieldRateLimit (cohort-keyed) and
    # robots.txt Crawl-delay; whichever trips first wins.
    #
    # Nothing is rate limited unless a rule says so. Sources are the
    # directives below and a robots.txt Crawl-delay:
    #
    #   BotShieldBotRateLimit Off                  # decline robots.txt Crawl-delay
    #   BotShieldBotRateLimit * 5                  # 1 req/5sec for every bot
    #   BotShieldBotRateLimit googlebot 0          # no limit for googlebot
    #   BotShieldBotRateLimit googlebot 1000 min   # 1000 req/min (3-arg form)
    #   BotShieldBotRateLimit Google    5000 min   # family pattern (shared budget)

    # Each provider's always-pass / testkey pair echoes back a
    # provider-specific hostname in the siteverify response, NOT
    # "localhost". Security review #1 added hostname binding; for
    # these test routes we tell BotShield what the always-pass
    # response will actually carry so the check doesn't false-
    # reject in CI. Production deployments leave this directive
    # off and pick up the r->server->server_hostname default.
    <Location /botshield/captcha-verify/turnstile>
        BotShieldCaptchaProvider          turnstile
        BotShieldCaptchaSiteKey            1x00000000000000000000AA
        BotShieldCaptchaSecretFile         /etc/botshield/turnstile-secret
        BotShieldCaptchaExpectedHostname   example.com
    </Location>

    <Location /botshield/captcha-verify/hcaptcha>
        BotShieldCaptchaProvider          hcaptcha
        BotShieldCaptchaSiteKey            10000000-ffff-ffff-ffff-000000000001
        BotShieldCaptchaSecretFile         /etc/botshield/hcaptcha-secret
        BotShieldCaptchaExpectedHostname   dummy-key-pass
    </Location>

    <Location /botshield/captcha-verify/recaptcha-v2>
        BotShieldCaptchaProvider          recaptcha-v2
        BotShieldCaptchaSiteKey            6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
        BotShieldCaptchaSecretFile         /etc/botshield/recaptcha-v2-secret
        BotShieldCaptchaExpectedHostname   testkey.google.com
    </Location>

    <Location /botshield/captcha-verify/recaptcha-v3>
        BotShieldCaptchaProvider           recaptcha-v3
        BotShieldCaptchaSiteKey            6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
        BotShieldCaptchaSecretFile         /etc/botshield/recaptcha-v3-secret
        BotShieldRecaptchaV3MinScore       0.5
        BotShieldCaptchaExpectedHostname   testkey.google.com
    </Location>

    <Location /botshield/captcha-verify/friendly>
        BotShieldCaptchaProvider   friendly
        BotShieldCaptchaSiteKey    FRIENDLY_CAPTCHA_SITEKEY_PLACEHOLDER
        BotShieldCaptchaSecretFile /etc/botshield/friendly-secret
    </Location>

    # GeeTest's "SiteKey" field holds the captcha_id (public). The
    # "SecretFile" field holds the captcha_key which gets HMAC'd over
    # the lot_number server-side to prove we're a trusted caller.
    <Location /botshield/captcha-verify/geetest>
        BotShieldCaptchaProvider   geetest
        BotShieldCaptchaSiteKey    GEETEST_CAPTCHA_ID_PLACEHOLDER
        BotShieldCaptchaSecretFile /etc/botshield/geetest-secret
    </Location>

    # Dev-only: trust X-Forwarded-For when it comes from loopback so we
    # can simulate varied client IPs during tests. In production the
    # trusted proxies list is whatever your edge/LB IPs are.
    RemoteIPHeader        X-Forwarded-For
    RemoteIPTrustedProxy  127.0.0.1
    RemoteIPTrustedProxy  ::1

    # Demo scope: /debug returns 403 "Hello World" via mod_botshield so we can
    # verify the module is intercepting requests. Everything else is served
    # normally by Apache's default file handler.
    <Location /debug>
        BotShieldDebug On
    </Location>

    # Demo scope: customize the challenge text, logo caption, logo file,
    # and help panel content. Exercises BotShieldPromptText,
    # BotShieldLogoLabel, BotShieldLogoFile, and BotShieldHelpFile together —
    # /about.html shows the help as always-visible with custom text.
    <Location /about.html>
        BotShieldPromptText "Please verify"
        BotShieldLogoLabel  "Crestline"
        BotShieldLogoFile   ${BS_REPO}/tests/site/assets/logos/01-guardian.svg
        BotShieldHelp       on
        BotShieldHelpFile   ${BS_REPO}/tests/site/bs-custom-help.html
    </Location>

    # Demo scope: everything stripped down to just the checkbox.
    # Honeypot demo (M5.1): any hit to this scope lands the client IP in
    # the flagged-IP table with honeypot_hit (+60 penalty) for 1 hour,
    # rollback-proof. The path looks like an exposed secrets file — the
    # kind of URL a scanner probes.
    <Location /admin/.env>
        BotShieldTrigger flag=honeypot_hit ttl=3600 log=admin-trap
    </Location>

    # Exercises BotShieldShowLogo, BotShieldShowLabel, BotShieldShowBox,
    # and BotShieldHelp all set off — the minimum a host page can carry.
    <Location /search.html>
        BotShieldHelp      off
        BotShieldShowLogo  off
        BotShieldShowLabel off
        BotShieldShowBox   off
    </Location>

    # Demo scope: keep the widget contents but drop the outer box so the
    # checkbox + label + brand float on the page.
    <Location /api/users.json>
        BotShieldShowBox off
    </Location>

    # Demo scope: full page override via BotShieldChallengeFile. The file
    # provides its own layout and chrome; the widget drops in at the
    # <!-- BOTSHIELD --> marker. Exercises the splice code path.
    <Location /login.html>
        BotShieldChallengeFile ${BS_REPO}/tests/site/bs-custom-page.html
    </Location>

    # M8 Turnstile demo. Score thresholds dropped so any request lands
    # at captcha tier deterministically ("always force captcha"). Keys
    # are Cloudflare's published always-pass dummies:
    #   sitekey 1x00000000000000000000AA
    #   secret  1x0000000000000000000000000000000AA
    # Always-silent-tier path. Tests that need an interstitial to exist
    # (cookie round-trip, PoW solving) must NOT depend on the ambient
    # first-sight-ip default to produce one: test_acceptance_pass_tier
    # needs a fresh browser on / to PASS, while test_cookie_gcm needs a
    # fresh browser to be CHALLENGED. Those cannot both hold on the same
    # path, and chasing the default just moves which file fails. Point
    # challenge-dependent tests here instead.
    #
    # Hard/captcha parked at the top of the permitted range so the tier
    # is silent and stays silent.

    # Browser-suite challenge path. The browser tests need a request
    # that is challenged while unsolved and served once solved -- a
    # round trip. Neither "/" nor /silent-demo can give them that:
    #
    #   "/"           passes. A recognised browser UA is credited
    #                 enough that missing-accept-language and
    #                 first-sight-ip together stay under the
    #                 threshold, so the tests' original premise
    #                 ("Mozilla UA + no Accept-Language = score 20 =>
    #                 silent") no longer holds. It held once; the
    #                 tests were erroring rather than running, so
    #                 nothing noticed when it stopped.
    #   /silent-demo  parks the threshold at 1, so it re-challenges a
    #                 client that has already solved. The reload never
    #                 reaches the origin page and the round trip
    #                 cannot complete.
    #
    # An explicit solved=no trigger is the same shape production uses
    # for its content gate, and it does not depend on any score.
    BotShieldRequestTrigger browser-gate path="/browser-gate.html" \
        solved=no status=pass tier=non-interactive ttl=0 \
        log=browser-gate

    <Location /silent-demo>
        BotShieldScoreNonInteractive  1
        BotShieldScoreInteractive    10000
        BotShieldScoreCaptcha 10000
    </Location>

    # Always-form-tier path, same rationale as /silent-demo: a test
    # that needs a form interstitial must not depend on a UA happening
    # to score above BotShieldScoreInteractive. SUSPICIOUS_UA in
    # test_acceptance_form_tier scores 10, which never reaches form (50)
    # at any sane first-sight-ip value.
    <Location /form-demo>
        BotShieldScoreNonInteractive  1
        BotShieldScoreInteractive    2
        BotShieldScoreCaptcha 10000
    </Location>

    <Location /captcha-demo>
        BotShieldScoreNonInteractive  1
        BotShieldScoreInteractive    2
        BotShieldScoreCaptcha 3
        BotShieldCaptchaProvider   turnstile
        BotShieldCaptchaSiteKey    1x00000000000000000000AA
        BotShieldCaptchaSecretFile /etc/botshield/turnstile-secret
    </Location>

    # M8 hCaptcha demo. Dummy keys are hCaptcha's published always-pass:
    #   sitekey 10000000-ffff-ffff-ffff-000000000001
    #   secret  0x0000000000000000000000000000000000000000
    # For a real siteverify success the POSTed response token must also
    # be the documented dummy 10000000-aaaa-bbbb-cccc-000000000001.
    <Location /hcaptcha-demo>
        BotShieldScoreNonInteractive  1
        BotShieldScoreInteractive    2
        BotShieldScoreCaptcha 3
        BotShieldCaptchaProvider   hcaptcha
        BotShieldCaptchaSiteKey    10000000-ffff-ffff-ffff-000000000001
        BotShieldCaptchaSecretFile /etc/botshield/hcaptcha-secret
    </Location>

    # M8 reCAPTCHA v2 demo. Dummy keys are Google's published test pair:
    #   sitekey 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
    #   secret  6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
    # The test secret accepts any response token for POST testing; the
    # widget in a real browser needs the matching test sitekey.
    <Location /recaptcha-v2-demo>
        BotShieldScoreNonInteractive  1
        BotShieldScoreInteractive    2
        BotShieldScoreCaptcha 3
        BotShieldCaptchaProvider   recaptcha-v2
        BotShieldCaptchaSiteKey    6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
        BotShieldCaptchaSecretFile /etc/botshield/recaptcha-v2-secret
    </Location>

    # M8 reCAPTCHA v3 demo. Real v3 keys come from the reCAPTCHA admin
    # console (https://www.google.com/recaptcha/admin) — Google does not
    # publish v3-specific test keys. The v2 test pair is used here for
    # interstitial rendering; end-to-end verify requires real v3 keys
    # because only the real siteverify path returns the score field our
    # threshold compares against. With the v2 test secret, v3 verify
    # will log "missing score" and fail open.
    <Location /recaptcha-v3-demo>
        BotShieldScoreNonInteractive  1
        BotShieldScoreInteractive    2
        BotShieldScoreCaptcha 3
        BotShieldCaptchaProvider      recaptcha-v3
        BotShieldCaptchaSiteKey       6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
        BotShieldCaptchaSecretFile    /etc/botshield/recaptcha-v3-secret
        BotShieldRecaptchaV3MinScore  0.5
    </Location>

    # M8 Friendly Captcha demo. EU-focused, privacy-oriented, invisible-
    # PoW-style (no user click). Unlike Turnstile/hCaptcha/reCAPTCHA,
    # Friendly Captcha does NOT publish iconic always-pass test keys —
    # real keys come from the free tier at friendlycaptcha.com. The
    # placeholders below let the interstitial render (widget loads with
    # its own sitekey-validation error message) so you can inspect the
    # DOM, but end-to-end verify requires real keys.
    <Location /friendly-demo>
        BotShieldScoreNonInteractive  1
        BotShieldScoreInteractive    2
        BotShieldScoreCaptcha 3
        BotShieldCaptchaProvider   friendly
        BotShieldCaptchaSiteKey    FRIENDLY_CAPTCHA_SITEKEY_PLACEHOLDER
        BotShieldCaptchaSecretFile /etc/botshield/friendly-secret
    </Location>

    # M8 GeeTest v4 demo. Chinese market leader, slider-style challenge.
    # Verify protocol diverges from the Google-family pattern — the
    # server signs lot_number with HMAC-SHA256(captcha_key) rather than
    # sending the raw secret in the body. GeeTest does NOT publish test
    # keys; real captcha_id + captcha_key come from dashboard.geetest.com.
    # Placeholders below let the interstitial render (initGeetest4 will
    # surface its own sitekey-unrecognized error in the browser) so you
    # can inspect the DOM. End-to-end verify requires real keys.
    <Location /geetest-demo>
        BotShieldScoreNonInteractive  1
        BotShieldScoreInteractive    2
        BotShieldScoreCaptcha 3
        BotShieldCaptchaProvider   geetest
        BotShieldCaptchaSiteKey    GEETEST_CAPTCHA_ID_PLACEHOLDER
        BotShieldCaptchaSecretFile /etc/botshield/geetest-secret
    </Location>
</VirtualHost>
</IfModule>

# vim: ft=apache
