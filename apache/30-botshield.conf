# mod_botshield - Apache module load + default LogFormat.
#
# Drop this file at /etc/httpd/conf.modules.d/30-botshield.conf
# (RHEL/Rocky) or /etc/apache2/mods-available/botshield.load
# (Debian/Ubuntu) and ensure the module is enabled in your
# distribution's usual way.
#
# What this file ships:
#   - LoadModule directive for mod_botshield.so
#   - The named LogFormat "botshield" - registers the field shape
#     once at server scope so every vhost / Location can reference
#     it without redefining. Operators override by re-defining
#     LogFormat with the same name later in their config; last
#     definition wins. The %{BS_*}e tokens read subprocess_env
#     entries that bs_decision_log populates on every decision-
#     emitting path. Env (not notes) is the right vehicle because
#     internal_redirect (mod_rewrite's `RewriteRule (.*) index.php`
#     style rules used by HUBzero/Joomla/Drupal/WordPress) deep-
#     copies subprocess_env into the redirect target but starts the
#     new request_rec with an empty notes table, so notes wouldn't
#     survive to log_transaction time.
#
# What this file does NOT ship: a CustomLog. mod_log_config opens
# CustomLog targets at server start regardless of whether anything
# ever writes to them, so a default-on CustomLog would leave an
# empty botshield-decisions.log under /var/log/httpd/ even on
# servers that never enable the module. Operators wire up logging
# explicitly, where they want it (server scope or per-vhost), e.g.:
#
#   CustomLog logs/botshield-decisions.log botshield env=BOTSHIELD
#
# The env=BOTSHIELD conditional gates the CustomLog to requests
# where bs_decision_log actually fired (every BotShield decision
# sets that env var); non-decision requests don't write a line.
#
# Operators with vhost-scoped logging (i.e. who already define their
# own CustomLog inside <VirtualHost>) write the decision log line
# inside that same scope - mod_log_config's CustomLog has fallback
# semantics, so server-scope CustomLog directives only fire for
# vhosts that didn't define their own logging.

LoadModule botshield_module modules/mod_botshield.so

<IfModule botshield_module>
<IfModule log_config_module>
    LogFormat "%{BS_TIME}e %a %>s tier=%{BS_TIER}e outcome=%{BS_OUTCOME}e score=%{BS_SCORE}e cookie=%{BS_COOKIE}e alg=%{BS_ALG}e reason=\"%{BS_REASON}e\" path=\"%U%q\"" botshield
</IfModule>
</IfModule>
