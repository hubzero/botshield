<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
  <title id="title">BotShield logo</title>
  <desc id="desc">Shield emblem with passive-intelligence arrows and active-defense scan bars, followed by the BotShield wordmark.</desc>

  <defs>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e8d9a"/>
      <stop offset="100%" stop-color="#55626e"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#314150"/>
      <stop offset="100%" stop-color="#1b2732"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1a2430" flood-opacity="0.22"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ccd7df" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="820" height="460" fill="#eff3f6"/>
  <rect width="820" height="460" fill="url(#grid)"/>

  <g filter="url(#softShadow)">
    <path d="M410 28 L532 74 Q530 206 410 276 Q290 206 288 74 Z" fill="url(#shieldFill)" stroke="url(#shieldEdge)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M410 54 L505 90 Q500 188 410 246 Q320 188 315 90 Z" fill="#f7fafc" opacity="0.96"/>
    <path d="M410 54 L410 246" stroke="#4a5866" stroke-width="10" stroke-linecap="round"/>
    <path d="M410 54 L505 90 Q500 188 410 246 Z" fill="#dfe6eb" opacity="0.98"/>
    <path d="M410 54 L410 246 Q320 188 315 90 Z" fill="#f8fbfd" opacity="0.98"/>

    <g fill="#5b6976">
      <path d="M334 102 H382 V90 L400 108 L382 126 V114 H334 Z"/>
      <path d="M330 140 H378 V128 L396 146 L378 164 V152 H330 Z"/>
      <path d="M328 178 H376 V166 L394 184 L376 202 V190 H328 Z"/>
    </g>

    <g fill="none" stroke="#5b6976" stroke-width="10" stroke-linecap="round">
      <path d="M428 96 H496"/>
      <path d="M428 122 H496"/>
      <path d="M428 148 H492"/>
      <path d="M428 174 H486"/>
      <path d="M428 200 H474"/>
    </g>

    <g transform="translate(514 150)">
      <rect x="0" y="0" width="54" height="44" rx="4" fill="#f4f8fb" stroke="#4f5d6a" stroke-width="5"/>
      <path d="M16 14 L24 22 L16 30" fill="none" stroke="#4f5d6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M38 14 L30 22 L38 30" fill="none" stroke="#4f5d6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g fill="#16212b" text-anchor="middle">
    <text x="410" y="352" font-family="Aptos, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="1.8">BOTSHIELD</text>
    <text x="410" y="392" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="23" letter-spacing="1.05" fill="#273542">Disciplined Judgment. Proportionate Response.</text>
  </g>
</svg>
