    <g fill="none" stroke="#657480" stroke-width="8" stroke-linecap="round">
      <path d="M145 61 H198"/>
      <path d="M145 83 H198"/>
      <path d="M145 105 H194"/>
      <path d="M145 127 H189"/>
      <path d="M145 149 H178"/>
