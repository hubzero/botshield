<svg xmlns="http://www.w3.org/2000/svg" width="760" height="204" viewBox="0 0 760 204" role="img" aria-labelledby="title desc">
  <title id="title">BotShield header logo</title>
  <desc id="desc">Transparent BotShield header lockup with shield emblem, response ladder cartridge, and wordmark.</desc>

  <defs>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a99a5"/>
      <stop offset="100%" stop-color="#62727f"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4d5b"/>
      <stop offset="100%" stop-color="#263441"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#05080c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)" transform="translate(22 12) scale(0.86)">
